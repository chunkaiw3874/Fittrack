<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
        }
    }).catch(function() {});
}
if ('caches' in window) {
    caches.keys().then(function(names) {
        for(var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
        }
    }).catch(function() {});
}

function hideLoading() {
    var loading = document.getElementById('loading');
    if (loading) {
        loading.style.opacity = '0';
        setTimeout(function() { 
            if (loading.parentNode) loading.parentNode.removeChild(loading);
        }, 300);
    }
}

setTimeout(function() {
    var loading = document.getElementById('loading');
    if (loading) {
        var status = document.getElementById('loading-status');
        if (status) status.innerText = '稍候片刻...';
    }
}, 3000);

setTimeout(hideLoading, 10000);

window.addEventListener('load', function() {
    setTimeout(hideLoading, 800);
});

var checkInterval = setInterval(function() {
    var root = document.getElementById('root');
    if (root && root.children.length > 0) {
        clearInterval(checkInterval);
        hideLoading();
    }
}, 200);

window.addEventListener('error', function(e) {
    console.error('App error:', e.message);
    hideLoading();
    var root = document.getElementById('root');
    if (root && root.children.length === 0) {
        root.innerHTML = '<div style="padding:30px;text-align:center"><h2 style="color:#f87171">⚠️ 載入失敗</h2><p style="color:#94a3b8;font-size:14px">' + e.message + '</p><p style="color:#64748b;font-size:12px;margin-top:20px">請清除 Safari 快取後重試</p></div>';
    }
});
</script>

            console.error('儲存資料失敗:', e);

            return false;
        }
    },
    remove: (key) => {
        try {
            localStorage.removeItem(key);
            return true;
        } catch (e) {
            return false;
        }
    }
};

    // v14: 子階段（'countdown' = 3秒預備倒數, 'exercising' = 執行中, 'done' = 完成等待手動進入下一個）
    const [phaseSubState, setPhaseSubState] = useState('countdown');
    const [countdownSec, setCountdownSec] = useState(3);
    // 動作搜尋頁狀態
    const [searchQuery, setSearchQuery] = useState('');
    const [filterMuscles, setFilterMuscles] = useState([]);

    const [progress, setProgress] = useState({});
    
    const [currentExerciseIdx, setCurrentExerciseIdx] = useState(0);
    const [completedSets, setCompletedSets] = useState([]);
    const [timerSeconds, setTimerSeconds] = useState(0);
    const [isTimerRunning, setIsTimerRunning] = useState(false);
    // 自動計時模式新增的 state
    const [autoMode, setAutoMode] = useState('idle'); // idle, countdown, exercising, set_done, resting, done
    // v14: 計時動作的目標秒數（可調整）
    const [autoTargetSec, setAutoTargetSec] = useState(0);
    // v15: 雙邊動作的當前邊
    const [autoBilateralSide, setAutoBilateralSide] = useState('left');
    // v15: 預備倒數的秒數
    const [autoCountdownSec, setAutoCountdownSec] = useState(3);
    const [autoSecondsLeft, setAutoSecondsLeft] = useState(0);
    const [soundEnabled, setSoundEnabled] = useState(true);
    const [vibrationEnabled, setVibrationEnabled] = useState(false);
    
    const [showSwapModal, setShowSwapModal] = useState(null);
    const [showDetailModal, setShowDetailModal] = useState(null);
    const [filterRegion, setFilterRegion] = useState('all');
    const [showSettings, setShowSettings] = useState(false);
    const [showSaveToast, setShowSaveToast] = useState(false);
    const [showInputModal, setShowInputModal] = useState(null);
    const [inputValue, setInputValue] = useState('');
    const [inputWeight, setInputWeight] = useState('');

    // 載入儲存的資料
    useEffect(() => {
        const settings = safeStorage.get('fittrack_settings');
        if (settings?.duration) {
            var d = settings.duration;
            if (typeof d === 'number') {
                if (d <= 20) d = 'quick';
                else if (d <= 35) d = 'standard';
                else d = 'deep';
            }
            if (d !== 'quick' && d !== 'standard' && d !== 'deep') {
                d = 'standard';
            }
            setDuration(d);
        }
        if (settings?.soundEnabled !== undefined) setSoundEnabled(settings.soundEnabled);
        if (settings?.vibrationEnabled !== undefined) setVibrationEnabled(settings.vibrationEnabled);
        var favs = safeStorage.get('fittrack_favorites');
        if (favs && Array.isArray(favs)) setFavoriteExercises(favs);
        
        const workouts = safeStorage.get('fittrack_customWorkouts');
        if (workouts) setCustomWorkouts(workouts);
        
        const prog = safeStorage.get('fittrack_progress');
        if (prog) setProgress(prog);
        
        // 載入身體數據
        var bd = safeStorage.get('fittrack_bodyData');
        if (bd && Array.isArray(bd)) {
            setBodyData(bd);
        } else {
            // 第一次載入，預設 Kevin 的最新資料
            const initialData = [
                {
                    date: '2026-05-03',
                    weight: 83.05,
                    bodyFat: 22.7,
                    muscleMass: 60.9,
                    visceralFat: 8.0,
                    waterMass: 47.6,
                    boneMineral: 3.3,
                    skeletalMuscle: 33.6,
                    proteinMass: 12.6,
                    bmr: 1757,
                    bodyAge: 39,
                    fatMass: 18.8,
                    trunkFat: 9.7,
                    bodyScore: 78,
                    note: '基準測量'
                }
            ];
            setBodyData(initialData);
            safeStorage.set('fittrack_bodyData', initialData);
        }
        
        var bg = safeStorage.get('fittrack_bodyGoal');
        if (bg) setBodyGoal(bg);
    }, []);

    // 計時器（手動模式）
    useEffect(() => {
        if (!isTimerRunning) return;
        const interval = setInterval(() => setTimerSeconds(s => s + 1), 1000);
        return () => clearInterval(interval);
    }, [isTimerRunning]);
    
    // v15: 自動倒數計時器（重寫）
    useEffect(() => {
        // idle / set_done / bilateral_done / done / paused 不跑
        if (['idle', 'set_done', 'bilateral_done', 'done', 'paused'].indexOf(autoMode) >= 0) return;
        if (!selectedDay) return;
        
        const config = durationConfigs[duration];
        const baseExercises = customWorkouts[selectedDay] || (defaultTemplates[selectedDay] && defaultTemplates[selectedDay].exercises) || [];
        const currentExercises = baseExercises.slice(0, config.exerciseCount);
        const currentExName = currentExercises[currentExerciseIdx];
        const currentEx = exerciseDB[currentExName];
        if (!currentEx) return;
        
        // ========== countdown 階段：3 秒預備倒數 ==========
        if (autoMode === 'countdown') {
            if (autoCountdownSec <= 0) return;
            const interval = setInterval(function() {
                setAutoCountdownSec(function(prev) {
                    if (prev === 3 || prev === 2 || prev === 1) notify('tick');
                    if (prev <= 1) {
                        // 預備結束 → 進入 exercising
                        setTimeout(function() {
                            var targetSec = autoTargetSec || parseSeconds(currentEx.defaultReps);
                            setAutoSecondsLeft(targetSec);
                            setAutoMode('exercising');
                        }, 100);
                        return 0;
                    }
                    return prev - 1;
                });
            }, 1000);
            return function() { clearInterval(interval); };
        }
        
        // ========== exercising 階段：實際動作倒數 ==========
        if (autoMode === 'exercising') {
            if (autoSecondsLeft <= 0) return;
            const interval = setInterval(function() {
                setAutoSecondsLeft(function(prevSec) {
                    var next = prevSec - 1;
                    if (next === 3 || next === 2 || next === 1) notify('tick');
                    if (next > 0) return next;
                    
                    // 倒數歸零
                    notify('finish');
                    
                    // 雙邊動作且還在做左邊 → 進入 bilateral_done（等手動進入右邊）
                    if (currentEx.isBilateral && autoBilateralSide === 'left') {
                        setTimeout(function() {
                            setAutoMode('bilateral_done');
                        }, 100);
                        return 0;
                    }
                    
                    // 一般情況（或雙邊右邊完成）→ 紀錄這組 + 進入 set_done（等手動進下一組）
                    setCompletedSets(function(prevCompletedSets) {
                        var newSets = prevCompletedSets.slice();
                        var doneSec = autoTargetSec || parseSeconds(currentEx.defaultReps);
                        newSets[currentExerciseIdx] = (newSets[currentExerciseIdx] || []).concat([doneSec]);
                        
                        setProgress(function(prevProgress) {
                            var today = new Date().toISOString().split('T')[0];
                            var newProgress = Object.assign({}, prevProgress);
                            if (!newProgress[today]) newProgress[today] = {};
                            newProgress[today] = Object.assign({}, newProgress[today]);
                            newProgress[today][selectedDay] = newSets;
                            
                            // v19.5: 同步 _byName
                            var todayExercises = getDayExercises(selectedDay);
                            var byName = newProgress[today]['_byName'] || {};
                            for (var i = 0; i < newSets.length; i++) {
                                if (todayExercises[i] && newSets[i] && newSets[i].length > 0) {
                                    byName[todayExercises[i]] = newSets[i];
                                }
                            }
                            newProgress[today]['_byName'] = byName;
                            
                            safeStorage.set('fittrack_progress', newProgress);
                            return newProgress;
                        });
                        
                        return newSets;
                    });
                    
                    setTimeout(function() {
                        setAutoMode('set_done');
                    }, 100);
                    return 0;
                });
            }, 1000);
            return function() { clearInterval(interval); };
        }
        
        // ========== resting 階段：休息倒數 → 進入下一組的預備 ==========
        if (autoMode === 'resting') {
            if (autoSecondsLeft <= 0) return;
            const interval = setInterval(function() {
                setAutoSecondsLeft(function(prevSec) {
                    var next = prevSec - 1;
                    if (next === 3 || next === 2 || next === 1) notify('tick');
                    if (next > 0) return next;
                    
                    // 休息結束 → 進入下一組的 countdown 預備
                    notify('rest_done');
                    setTimeout(function() {
                        setAutoBilateralSide('left'); // 重置邊
                        setAutoCountdownSec(3);
                        setAutoMode('countdown');
                    }, 100);
                    return 0;
                });
            }, 1000);
            return function() { clearInterval(interval); };
        }
    }, [autoMode, autoCountdownSec, autoSecondsLeft, currentExerciseIdx, selectedDay, duration, customWorkouts]);
    
    // 啟動自動模式
    const startAutoMode = () => {
        // v15: 改成從 countdown 開始（3 秒預備）
        if (!selectedDay) return;
        setAutoBilateralSide('left');
        setAutoCountdownSec(3);
        setAutoMode('countdown');
    };
    
    // v15: 進入下一組（手動）
    const goToNextSet = () => {
        if (!selectedDay) return;
        const config = durationConfigs[duration];
        const baseExercises = customWorkouts[selectedDay] || (defaultTemplates[selectedDay] && defaultTemplates[selectedDay].exercises) || [];
        const currentExercises = baseExercises.slice(0, config.exerciseCount);
        const currentExName = currentExercises[currentExerciseIdx];
        const currentEx = exerciseDB[currentExName];
        if (!currentEx) return;
        
        // 檢查是否完成所有組數
        var totalSets = config.setsPerExercise;
        if (completedSets[currentExerciseIdx] && completedSets[currentExerciseIdx].length >= totalSets) {
            // 全部完成
            setAutoMode('done');
            return;
        }
        
        // 進入休息
        var restTime = Math.round(currentEx.defaultRest * config.restMultiplier);
        setAutoSecondsLeft(restTime);
        setAutoMode('resting');
    };
    
    // v15: 雙邊動作 - 進入右邊（手動）
    const goToRightSide = () => {
        if (!selectedDay) return;
        const config = durationConfigs[duration];
        const baseExercises = customWorkouts[selectedDay] || (defaultTemplates[selectedDay] && defaultTemplates[selectedDay].exercises) || [];
        const currentExercises = baseExercises.slice(0, config.exerciseCount);
        const currentExName = currentExercises[currentExerciseIdx];
        const currentEx = exerciseDB[currentExName];
        if (!currentEx) return;
        
        setAutoBilateralSide('right');
        setAutoCountdownSec(3);
        setAutoMode('countdown');
    };
    
    // 暫停 / 繼續自動模式
    const togglePauseAuto = () => {
        if (autoMode === 'paused') {
            // 繼續：根據儲存的狀態回去
            // 簡化：暫停時就停在當前秒數，按繼續就繼續
        }
    };
    
    // 跳過當前階段
    const skipCurrentPhase = () => {
        setAutoSecondsLeft(1); // 強制觸發階段切換
    };
    
    // 完全停止自動模式
    const stopAutoMode = () => {
        setAutoMode('idle');
        setAutoSecondsLeft(0);
    };

    const saveSettings = (newLevel) => {
        setDuration(newLevel);
        var existing = safeStorage.get('fittrack_settings') || {};
        existing.duration = newLevel;
        safeStorage.set('fittrack_settings', existing);
        showToast();
    };
    
    const saveSoundSetting = (enabled) => {
        setSoundEnabled(enabled);
        var existing = safeStorage.get('fittrack_settings') || {};
        existing.soundEnabled = enabled;
        safeStorage.set('fittrack_settings', existing);
    };
    
    const saveVibrationSetting = (enabled) => {
        setVibrationEnabled(enabled);
        var existing = safeStorage.get('fittrack_settings') || {};
        existing.vibrationEnabled = enabled;
        safeStorage.set('fittrack_settings', existing);
    };
    
    // 播放聲音
    // v18: 共用的 AudioContext + iOS 解鎖機制
    const audioCtxRef = useRef(null);
    const audioUnlockedRef = useRef(false);
    
    // 取得或建立 AudioContext
    const getAudioContext = () => {
        if (!audioCtxRef.current) {
            try {
                audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) { return null; }
        }
        return audioCtxRef.current;
    };
    
    // iOS 需要在使用者互動時「解鎖」AudioContext
    const unlockAudio = () => {
        if (audioUnlockedRef.current) return;
        var ctx = getAudioContext();
        if (!ctx) return;
        // 播放一個無聲的緩衝來解鎖
        if (ctx.state === 'suspended') {
            ctx.resume();
        }
        try {
            var buffer = ctx.createBuffer(1, 1, 22050);
            var source = ctx.createBufferSource();
            source.buffer = buffer;
            source.connect(ctx.destination);
            source.start(0);
            audioUnlockedRef.current = true;
        } catch (e) {}
    };
    
    // App 啟動後監聽第一次點擊來解鎖音訊（iOS 必要）
    useEffect(() => {
        const handleFirstTouch = () => {
            unlockAudio();
        };
        document.addEventListener('touchstart', handleFirstTouch, { once: false, passive: true });
        document.addEventListener('click', handleFirstTouch, { once: false, passive: true });

                wakeLockRef.current.addEventListener('release', () => {

                console.log('Wake lock failed:', e.message);

        const releaseWakeLock = async () => {

    const playBeep = (frequency, duration) => {
        if (!soundEnabled) return;
        try {
            var ctx = getAudioContext();
            if (!ctx) return;
            // 確保 context 是 running 狀態
            if (ctx.state === 'suspended') ctx.resume();
            
            var oscillator = ctx.createOscillator();
            var gainNode = ctx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);
            oscillator.frequency.value = frequency || 800;
            oscillator.type = 'sine';
            // 較大音量
            gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + (duration || 0.2));
            oscillator.start(ctx.currentTime);
            oscillator.stop(ctx.currentTime + (duration || 0.2));
        } catch (e) { console.error('playBeep error:', e); }
    };

        const isCableDay = selectedDay && selectedDay.indexOf('smith_') === 0;
        
        return Object.entries(exerciseDB)
            .filter(([name, ex]) => {

                    if (aIsCable !== bIsCable) return bIsCable - aIsCable;

    const startTraining = (day) => {

                        setTimeout(function() {
                            setPhaseSubState('exercising');
                        }, 100);
                        return 0;
                    }
                    return prev - 1;
                });
            }, 1000);
            return function() { clearInterval(interval); };
        }
        
        // 處理執行階段倒數

                setPhaseSecondsLeft(function(prev) {

                        notify('tick');

                        setTimeout(function() {

                        return 0;

    // 簡單的 Markdown 渲染（純文字+格式，不依賴外部 library）
    const renderMarkdown = (text) => {
        if (!text) return null;
        const lines = text.split('\n');
        const elements = [];
        let inCodeBlock = false;
        let codeContent = [];
        let inTable = false;
        let tableRows = [];
        
        const flushTable = () => {
            if (tableRows.length === 0) return;
            const headerRow = tableRows[0];
            const dataRows = tableRows.slice(2); // 跳過分隔線
            elements.push(React.createElement('div', { 
                key: 'table-' + elements.length,
                className: 'overflow-x-auto my-3'
            },
                React.createElement('table', { className: 'w-full text-xs' },
                    React.createElement('thead', null,
                        React.createElement('tr', { className: 'border-b border-slate-700' },
                            headerRow.map((cell, i) => 
                                React.createElement('th', { 
                                    key: i,
                                    className: 'px-2 py-2 text-left text-cyan-400 font-bold'
                                }, cell)
                            )
                        )
                    ),
                    React.createElement('tbody', null,
                        dataRows.map((row, i) =>
                            React.createElement('tr', { 
                                key: i,
                                className: 'border-b border-slate-800'
                            },
                                row.map((cell, j) =>
                                    React.createElement('td', { 
                                        key: j,
                                        className: 'px-2 py-2 text-slate-300'
                                    }, renderInline(cell))
                                )
                            )
                        )
                    )
                )
            ));
            tableRows = [];
            inTable = false;
        };
        
        // 處理行內 markdown（粗體、斜體、code）
        const renderInline = (str) => {
            if (!str) return str;
            // 處理 **bold**
            const parts = [];
            let lastIdx = 0;
            const regex = /\*\*([^*]+)\*\*|`([^`]+)`/g;
            let match;
            while ((match = regex.exec(str)) !== null) {
                if (match.index > lastIdx) {
                    parts.push(str.substring(lastIdx, match.index));
                }
                if (match[1]) {
                    parts.push(React.createElement('strong', { 
                        key: 'b' + match.index,
                        className: 'text-white font-bold'
                    }, match[1]));
                } else if (match[2]) {
                    parts.push(React.createElement('code', { 
                        key: 'c' + match.index,
                        className: 'bg-slate-800 px-1.5 py-0.5 rounded text-amber-300 text-xs font-mono'
                    }, match[2]));
                }
                lastIdx = match.index + match[0].length;
            }
            if (lastIdx < str.length) {
                parts.push(str.substring(lastIdx));
            }
            return parts.length > 0 ? parts : str;
        };
        
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            
            // 程式碼區塊
            if (line.startsWith('```')) {
                if (inCodeBlock) {
                    elements.push(React.createElement('pre', { 
                        key: i,
                        className: 'bg-slate-900 border border-slate-800 rounded-xl p-3 my-2 overflow-x-auto'
                    }, React.createElement('code', { 
                        className: 'text-xs text-slate-300 font-mono whitespace-pre'
                    }, codeContent.join('\n'))));
                    codeContent = [];
                    inCodeBlock = false;
                } else {
                    flushTable();
                    inCodeBlock = true;
                }
                continue;
            }
            if (inCodeBlock) {
                codeContent.push(line);
                continue;
            }
            
            // 表格
            if (line.startsWith('|')) {
                const cells = line.split('|').slice(1, -1).map(c => c.trim());
                tableRows.push(cells);
                inTable = true;
                continue;
            } else if (inTable) {
                flushTable();
            }
            
            // 標題
            if (line.startsWith('# ')) {
                elements.push(React.createElement('h1', { 
                    key: i,
                    className: 'text-2xl font-black text-white mt-4 mb-3'
                }, line.substring(2)));
            } else if (line.startsWith('## ')) {
                elements.push(React.createElement('h2', { 
                    key: i,
                    className: 'text-xl font-bold text-cyan-300 mt-5 mb-2 pb-1 border-b border-slate-800'
                }, line.substring(3)));
            } else if (line.startsWith('### ')) {
                elements.push(React.createElement('h3', { 
                    key: i,
                    className: 'text-base font-bold text-amber-300 mt-3 mb-2'
                }, line.substring(4)));
            } else if (line.startsWith('#### ')) {
                elements.push(React.createElement('h4', { 
                    key: i,
                    className: 'text-sm font-bold text-emerald-300 mt-2 mb-1'
                }, line.substring(5)));
            }
            // 引言
            else if (line.startsWith('> ')) {

                                                    }
                                                    return r;
                                                }).join(' • ')
                                            )
                                        ))
                                    )
                                );
                            })
                        );
                    })
                ),
                React.createElement('div', { className: 'bg-blue-950/30 border border-blue-700/30 rounded-2xl p-4' },
                    React.createElement('p', { className: 'text-sm font-semibold text-blue-300 mb-2' }, '💾 備份建議'),
                    React.createElement('p', { className: 'text-xs text-slate-300 leading-relaxed' }, '所有數據儲存在你的設備上。建議每月截圖此頁面備份，預防數據遺失。')
                )
            )
        );
    }

    return null;
}

// ============================================
// 啟動應用
// ============================================
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(FitnessApp));




</script>
